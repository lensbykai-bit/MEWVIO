name: Build MEWVIO Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable optimized release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Create Android project files
        run: |
          flutter create --no-pub --platforms=android --project-name mewvio .
          # Flutter create seeds its own SDK lockfile even for an existing app.
          git restore --source=HEAD -- pubspec.lock

      - name: Configure alternative Gradle repositories
        run: python3 scripts/add_gradle_mirrors.py

      - name: Restore approved MEWVIO kitten icon
        run: |
          base64 --decode branding/android_icon_128.png.base64 > assets/images/app_icon.png
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          data=Path('assets/images/app_icon.png').read_bytes()
          expected='320e6255adb532b3c5107da09cfc1561589531c5381f9b4a324977bf63046e73'
          assert data.startswith(bytes.fromhex('89504e470d0a1a0a')), 'Invalid PNG'
          assert hashlib.sha256(data).hexdigest()==expected, 'Icon checksum mismatch'
          print('MEWVIO original icon verified')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          txt=manifest.read_text()
          txt=txt.replace('android:label="mewvio"', 'android:label="MEWVIO"')
          manifest.write_text(txt)
          PY

      - name: Configure fast purple splash
        run: python3 scripts/configure_splash.py

      - name: Enable release APK network access
        run: python3 scripts/configure_android_network.py

      - name: Configure creator Camera and Gallery permissions
        run: python3 scripts/configure_android_media.py

      - name: Generate bundled offline video samples
        run: bash scripts/generate_demo_videos.sh

      - name: Bundle MEWVIO demo images for offline use
        run: python3 scripts/package_demo_photos.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Save resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: MEWVIO-dependency-lockfile
          path: pubspec.lock
          if-no-files-found: error

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze app
        run: flutter analyze --no-fatal-infos

      - name: Test account and profile flows
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MEWVIO-Social-v0.7.0-Camera-Creator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
