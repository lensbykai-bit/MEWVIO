name: Build MEWVIO Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name mewvio .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MEWVIO-Android-v0.1-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
