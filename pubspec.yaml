name: mewvio
description: MEWVIO Social - videos, communities, chats and voice rooms (beta)
publish_to: none
version: 0.6.2+24

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  video_player: ^2.9.5
  supabase_flutter: 2.18.3
  image_picker: 1.2.4
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/mewvio-cat.svg
    - assets/videos/
    - assets/demo/

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#6338D8'
  adaptive_icon_foreground: assets/images/app_icon.png
