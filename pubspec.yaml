name: mewvio
description: MEWVIO - social community mobile application (Stage 1 demo)
publish_to: none
version: 0.1.7+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/mewvio-cat.svg
    - assets/videos/

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#6338D8'
  adaptive_icon_foreground: assets/images/app_icon.png
