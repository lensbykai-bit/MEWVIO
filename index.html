function rightRender(){ $('#rightbar').innerHTML=`<div class="right-head" style="display:flex;justify-content:space-between;align-items:center">Creators to follow <span class="badge-online">● Community</span></div><div class="side-card">${creators.map(p=>`<div class="side-person">${avatar(p.emoji,'sm')}<div class="text"><b>${p.name} <span class="verified">✓</span></b><small>${p.desc}</small></div><button class="follow-btn ${state.followed.has(p.id)?'following':''}" data-action="follow" data-id="${p.id}">${state.followed.has(p.id)?'✓ Following':'+ Follow'}</button></div>`).join('')}</div><div class="right-head">🔥 Trending in Cambodia</div><div class="side-card">${['#MadeInCambodia','#KhmerCreators','#MEWVIOSocial','#CambodiaTravel','#TechCambodia'].map((tag,i)=>`<div class="trend"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><b>${tag}</b><small>Explore • Demo trending</small></div></div>`).join('')}</div><div class="join-banner"><span class="pill">✨ YOUR WORLD, YOUR VOICE</span><h3 style="margin-top:12px">Your community starts here</h3><p>ស្វែងរកមិត្តភក្តិ បង្កើតវីដេអូ និងភ្ជាប់មនុស្សចូលគ្នា។</p><button class="primary" data-page="groups">Explore Communities ${ICON('groups','small')}</button></div>`}
function sectionTitle(name,more,action){return `<div class="section-heading"><h2>${name}</h2><button class="link" data-page="${action}">${more} →</button></div>`}
function renderHome(){const posts=[...state.posts,...demoPosts].filter(p=>state.feedTab==='for-you'||state.feedTab==='following'?state.feedTab==='for-you'||p.category==='following'||p.user==='MEWVIO Creator':true).filter(p=>!state.search||((p.body||'')+(p.user||'')).toLowerCase().includes(state.search.toLowerCase()));return `<section class="hero"><div style="z-index:1"><span class="pill">🇰🇭 THE NEXT SOCIAL EXPERIENCE</span><h1>ស្វាគមន៍មកកាន់ <span class="gradient-text">MEWVIO Social</span></h1><p>មើលវីដេអូ • បង្កើតមិត្តភាព • ចែករំលែកគំនិត<br>One place. Every connection. Endless creativity.</p><button class="primary" data-page="shorts">Explore Shorts ${ICON('play','small')}</button></div><div class="hero-graphic">🐱</div></section>${sectionTitle('Stories & Moments','See all','discover')}<div class="story-row">${[{name:'Your Story',emoji:'➕'},...creators.map(x=>({name:x.name.split(' ')[0],emoji:x.emoji})),{name:'MEWVIO',emoji:'💜'},{name:'Khmer',emoji:'🇰🇭'}].map((x,i)=>`<button class="story" data-action="story" data-id="${i}">${avatar(x.emoji)}<b>${x.name}</b></button>`).join('')}</div><div class="panel composer"><div class="composer-top">${avatar('🐱')}<button class="composer-input" data-action="create-post">តើអ្នកចង់ចែករំលែកអ្វីថ្ងៃនេះ?</button></div><div class="composer-footer"><button class="composer-btn" data-action="create-post">${ICON('image','small')} Photo / Post</button><button class="composer-btn" data-action="upload-video">${ICON('play','small')} Short Video</button><button class="composer-btn" data-page="rooms">${ICON('rooms','small')} Voice Room</button><button class="link ml-auto" data-action="create-post">+ Create</button></div></div><div class="section-heading"><h2>Explore Your Feed</h2><div class="tabs"><button class="tab ${state.feedTab==='for-you'?'active':''}" data-action="feed" data-id="for-you">For You</button><button class="tab ${state.feedTab==='following'?'active':''}" data-action="feed" data-id="following">Following</button></div></div>${posts.length?posts.map(postHTML).join(''):`<div class="empty-state">មិនមាន Post ដែលត្រូវនឹងការស្វែងរកទេ។</div>`}`}
function postHTML(p){const liked=state.liked.has(p.id),bookmarked=state.saved.has(p.id);let count=(p.likes||0)+(liked?1:0);return `<article class="panel post"><div class="post-header">${avatar(p.emoji||'🐱')}<div class="post-person"><b>${escapeHTML(p.user)} <span class="verified">✓</span></b><small>${escapeHTML(p.time||'ឥឡូវនេះ')} • 🌐 Public</small></div><button class="icon-btn" style="border:0;background:none" data-action="post-more" data-id="${p.id}" aria-label="Post options">${ICON('more')}</button></div><div class="post-text">${escapeHTML(p.body)}</div>${p.img?`<div class="media-wrap portrait"><img class="media-photo" src="${ASSET(p.img)}" alt="Original visual for ${escapeHTML(p.user)}"><div class="media-shade"></div><span class="media-badge">✨ FEATURED MOMENT</span></div>`:''}<div class="post-counts"><span>❤️ ${count.toLocaleString()} likes</span><span>${(p.comments||0)+(state.comments[p.id]||[]).length} comments · ${p.shares||0} shares</span></div><div class="post-actions"><button class="post-action ${liked?'on':''}" data-action="like" data-id="${p.id}">${ICON('heart')} ${liked?'Liked':'Like'}</button><button class="post-action" data-action="comments" data-id="${p.id}">${ICON('chat')} Comment</button><button class="post-action" data-action="share" data-id="${p.id}">${ICON('share')} Share</button><button class="post-action ${bookmarked?'on':''}" data-action="save" data-id="${p.id}">${ICON('bookmark')} Save</button></div>${state.openComments===p.id?`<div class="comments-area">${(state.comments[p.id]||[]).map(c=>`<div class="comment"><b>MEWVIO Creator:</b> ${escapeHTML(c)}</div>`).join('')}<div class="commentbox"><input id="comment-input" placeholder="សរសេរ Comment..." maxlength="240"><button class="sub-btn" data-action="send-comment" data-id="${p.id}">${ICON('send','small')}</button></div></div>`:''}</article>`}
function renderShorts(){const r=reels[state.reel]||reels[0], key=r.id;return `<div class="page-title"><span class="eyebrow">TIKTOK + KUAISHOU INSPIRED</span><h1>Short Video Studio 🎬</h1><p>រុករកវីដេអូខ្លីៗ ចូលចិត្ត ចែករំលែក និងតាមដាន Creator។</p></div><div class="shorts-layout"><div class="video-shell"><video id="reel-video" src="${ASSET(key+'.mp4')}" poster="${ASSET(key+'.jpg')}" loop playsinline preload="metadata" aria-label="Original demo motion clip"></video><div class="video-gradient"></div><div class="video-top"><span class="pill">● FOR YOU</span><span class="demo-stamp">SAMPLE VIDEO</span></div><button class="play-overlay ${state.playing?'hide':''}" data-action="toggle-video" title="Play demo video">${ICON('play')}</button><div class="video-bottom"><b>@${escapeHTML(r.user.replaceAll(' ','').toLowerCase())} <span class="verified">✓</span></b><h3>${escapeHTML(r.title)}</h3><p>${escapeHTML(r.body)}</p></div><div class="video-rail"><button class="rail-item" data-action="follow" data-id="${creators[state.reel].id}">${avatar(r.emoji,'sm')}<span>${state.followed.has(creators[state.reel].id)?'Following':'Follow +'}</span></button><button class="rail-item ${state.liked.has(key)?'on':''}" data-action="like" data-id="${key}">${ICON('heart')} <span>${(r.likes+(state.liked.has(key)?1:0)).toLocaleString()}</span></button><button class="rail-item" data-action="reel-comments">${ICON('chat')} <span>Comments</span></button><button class="rail-item" data-action="share" data-id="${key}">${ICON('share')} <span>Share</span></button><button class="rail-item" data-action="next-video">${ICON('play')} <span>Next</span></button></div></div><div><div class="panel" style="padding:17px"><h3 style="margin:0 0 7px">Discover the next video</h3><p class="muted" style="font-size:11px;line-height:1.8;margin:0 0 15px">វីដេអូខាងក្រោមជាគំរូ ដែលបង្កើតសម្រាប់ UI នេះ។</p>${reels.map((x,i)=>`<button class="next-video ${i===state.reel?'active':''}" data-action="select-reel" data-id="${i}"><img src="${ASSET(x.id+'.jpg')}" alt="${escapeHTML(x.title)}"><span><b>${escapeHTML(x.title)}</b><small>${x.user} · ${x.views} views</small></span></button>`).join('')}<button class="primary" style="width:100%;margin-top:8px" data-action="upload-video">${ICON('upload','small')} Upload a Video</button></div><div class="guidance" style="margin-top:15px">${ICON('lock')}<span><b>Demo mode:</b> Play / pause works with sample videos. Real uploads, recommendations and livestreaming need a backend.</span></div></div></div>`}
function renderRooms(){const list=rooms.filter(r=>state.roomFilter==='All'||r.topic===state.roomFilter);return `<div class="page-title"><span class="eyebrow">LITMATCH INSPIRED COMMUNITY</span><h1>Voice Party Rooms 🎙️</h1><p>ជជែកកម្សាន្តជាមួយសហគមន៍តាមចំណាប់អារម្មណ៍រួម។</p></div><div class="guidance">${ICON('lock')}<span>សុវត្ថិភាពជាចម្បង៖ អ្នកប្រើប្រាស់អាច Report/Block បាន។ សម្រាប់អនីតិជន ត្រូវកំណត់ការទាក់ទងពីអ្នកមិនស្គាល់ និងប្រើការត្រួតពិនិត្យសមស្រប។ Voice Rooms នៅទីនេះជាគំរូ UI មិនមានការភ្ជាប់សំឡេងពិតទេ។</span></div><div class="chip-row">${['All','Social','Music','Creator','Learning'].map(x=>`<button class="chip ${state.roomFilter===x?'active':''}" data-action="room-filter" data-id="${x}">${x}</button>`).join('')}</div><div class="card-grid">${list.map(r=>`<article class="room-card"><div class="room-cover"><span class="pill" style="background:#0714279b;border-color:#ffffff50;color:#fff">${r.topic}</span><div class="room-emoji">${r.emoji}</div></div><div class="room-info"><h3>${r.name}</h3><p>${r.desc}</p><div class="room-footer"><div class="mini-people">${r.people}<small> · ${r.count} demo</small></div><button class="sub-btn" data-action="join-room" data-id="${r.id}">Join Room</button></div></div></article>`).join('')}</div>`}
function renderGroups(){const list=state.groups.filter(g=>(state.groupFilter==='All'||g.topic===state.groupFilter)&&(!state.search||(g.name+g.desc).toLowerCase().includes(state.search.toLowerCase())));return `<div class="page-title"><span class="eyebrow">FACEBOOK INSPIRED COMMUNITIES</span><h1>Communities & Groups 👥</h1><p>បង្កើតសហគមន៍ តាមដានប្រធានបទដែលចូលចិត្ត និងជួបអ្នកមានចំណូលចិត្តដូចគ្នា។</p></div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="chip-row" style="margin:9px 0 20px">${['All','Creator','Technology','Art','Travel'].map(x=>`<button class="chip ${state.groupFilter===x?'active':''}" data-action="group-filter" data-id="${x}">${x}</button>`).join('')}</div><button class="primary" data-action="create-group" style="font-size:11px">${ICON('plus','small')} New Group</button></div><div class="card-grid">${list.map(g=>`<article class="group-card"><div class="group-cover"><span class="group-badge">${g.topic}</span><span>${g.emoji}</span></div><div class="group-info"><h3>${escapeHTML(g.name)}</h3><p>${escapeHTML(g.desc)}</p><div class="room-footer"><span class="tiny">${g.count} demo members</span><button class="sub-btn" data-action="join-group" data-id="${g.id}">${state.joined.has(g.id)?'✓ Joined':'+ Join Group'}</button></div></div></article>`).join('')}</div>`}
function renderLive(){return `<div class="page-title"><span class="eyebrow">CREATOR FIRST · LIVE VIDEO</span><h1>Live & Creator Center 🔴</h1><p>ស្វែងយល់ពី Live Streaming, Creator និងរបៀបបង្កើតមាតិកាផ្ទាល់ខ្លួន។</p></div><div class="guidance">${ICON('live')}<span><b>Sample previews only.</b> ការផ្សាយផ្ទាល់ពិតប្រាកដ និងប្រព័ន្ធ Gift / Wallet មិនទាន់ត្រូវបានភ្ជាប់ទេ។</span></div><div class="card-grid">${[{name:'Cambodia Travel Live',user:'Sophea Vlog',img:'angkor.jpg',count:'1.2K demo viewers'},{name:'Create with Dara',user:'Dara Creates',img:'city.jpg',count:'540 demo viewers'},{name:'Art & Music Night',user:'Community Team',img:'live.jpg',count:'870 demo viewers'},{name:'Inspire & Learn',user:'MEWVIO Team',img:'create.jpg',count:'330 demo viewers'}].map(x=>`<div class="panel live-card"><div class="live-cover"><img src="${ASSET(x.img)}" alt="${x.name}"><span class="live-tag">DEMO LIVE</span><span class="live-viewers">👁 ${x.count}</span><span class="live-title">${x.name}</span></div><div class="live-info"><span class="tiny">${x.user}</span><button class="sub-btn" data-action="live-preview">Preview ${ICON('play','small')}</button></div></div>`).join('')}</div><div class="join-banner"><h3>Ready to become a Creator? 🎬</h3><p>អ្នកអាចសាកល្បងរើសវីដេអូពីទូរស័ព្ទ/កុំព្យូទ័រ ដើម្បី Preview ក្នុងកម្មវិធីនេះ។</p><button class="primary" data-action="upload-video">${ICON('upload','small')} Open Creator Studio</button></div>`}
function renderChats(){const person=creators.find(p=>p.id===state.activeChat);const messages=state.chat[state.activeChat]||[];return `<div class="page-title"><span class="eyebrow">MESSENGER INSPIRED</span><h1>Messages 💬</h1><p>Chat Interface ដែលមានការបង្ហាញសារក្នុង Browser សម្រាប់សាកល្បង។</p></div><div class="chat-layout"><div class="chat-list"><h3>All Messages</h3>${creators.map(p=>`<button class="chat-person ${state.activeChat===p.id?'active':''}" data-action="select-chat" data-id="${p.id}">${avatar(p.emoji,'sm')}<div class="chat-details"><b>${p.name}</b><small>${escapeHTML((state.chat[p.id]||[]).slice(-1)[0]?.text.slice(0,22)||'Start a chat')}…</small></div></button>`).join('')}</div><div class="thread"><div class="thread-top">${avatar(person.emoji,'sm')}<div><b>${person.name} <span class="verified">✓</span></b><div class="tiny">● Demo conversation · local only</div></div></div><div class="thread-scroll" id="thread-scroll"><div style="text-align:center;color:#667d9a;font-size:10px">Messages stay in this browser — no real person receives them.</div>${messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${escapeHTML(m.text)}<small>${m.time}</small></div>`).join('')}</div><form class="chat-compose" id="chat-form"><input id="message-input" autocomplete="off" placeholder="សរសេរសាររបស់អ្នក..." maxlength="500"><button type="submit" class="primary">${ICON('send','small')}</button></form></div></div>`}
function renderDiscover(){return `<div class="page-title"><span class="eyebrow">DISCOVER SOMETHING NEW</span><h1>Explore Cambodia ✨</h1><p>ស្វែងរកវីដេអូ Creator សហគមន៍ និងប្រធានបទកំពុងពេញនិយម។</p></div><div class="section-heading"><h2>Featured topics</h2><small>Curated demo</small></div><div class="discover-grid">${[{file:'angkor',name:'#ExploreCambodia',page:'shorts'},{file:'city',name:'#CityVibes',page:'shorts'},{file:'create',name:'#CreativeLife',page:'shorts'},{file:'live',name:'#MusicLive',page:'live'},{file:'food',name:'#KhmerFood',page:'groups'},{file:'angkor',name:'#CultureKhmer',page:'groups'}].map(x=>`<div class="discover-tile" data-page="${x.page}"><img src="${ASSET(x.file+'.jpg')}" alt="${x.name}"><b>${x.name}</b></div>`).join('')}</div>${sectionTitle('Meet talented creators','See all','groups')}<div class="card-grid">${creators.map(p=>`<div class="side-card" style="margin:0;display:flex;align-items:center;gap:10px">${avatar(p.emoji,'lg')}<div style="min-width:0;flex:1"><b style="font-size:12px">${p.name}</b><div class="tiny">${p.desc}</div><button style="margin-top:7px" class="follow-btn ${state.followed.has(p.id)?'following':''}" data-action="follow" data-id="${p.id}">${state.followed.has(p.id)?'✓ Following':'+ Follow'}</button></div></div>`).join('')}</div>`}
function renderProfile(){return `<div class="page-title"><span class="eyebrow">YOUR DIGITAL SPACE</span><h1>My Profile 🐱</h1><p>គ្រប់គ្រងព័ត៌មាន និងមាតិកាដែលអ្នកបានបង្កើតក្នុងគំរូនេះ។</p></div><div class="panel"><div class="profile-cover"></div><div class="profile-content"><div class="profile-head">${avatar('🐱','xl')}<button class="ghost-btn" data-action="edit-profile">${ICON('user','small')} Edit Profile</button></div><h2 class="profile-name">MEWVIO Creator <span class="verified">✓</span></h2><div class="mini-profile">@mewvio.me · 🇰🇭 Cambodia</div><p style="font-size:12px;color:#acbfd6;line-height:1.8">Create • Connect • Inspire ✨<br>Welcome to MEWVIO Social Universe.</p><div class="profile-stats"><div><b>${state.posts.length}</b><span>My posts</span></div><div><b>${state.followed.size}</b><span>Following</span></div><div><b>${state.joined.size}</b><span>Groups joined</span></div></div><div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:14px">My Posts</h3><button class="primary" style="font-size:11px" data-action="create-post">${ICON('plus','small')} New Post</button></div>${state.posts.length?state.posts.map(p=>`<div class="my-post">${escapeHTML(p.body)}<div class="tiny" style="margin-top:5px">${p.time}</div></div>`).join(''):`<div class="empty-state">មិនទាន់មាន Post ទេ។ សាកល្បងបង្កើត Post ដំបូងរបស់អ្នក!</div>`}<div class="footer-note">© 2026 MEWVIO Technologies. All rights reserved.</div></div></div>`}
function render(){navRender();rightRender();let contents={home:renderHome,shorts:renderShorts,rooms:renderRooms,groups:renderGroups,live:renderLive,chats:renderChats,discover:renderDiscover,profile:renderProfile};$('#view').innerHTML=(contents[state.tab]||renderHome)();if(state.tab==='chats'){const el=$('#thread-scroll');if(el)el.scrollTop=el.scrollHeight};if(state.tab==='shorts'&&state.playing){const v=$('#reel-video');if(v)v.play().catch(()=>{state.playing=false;render()})}}
function go(page){state.tab=page;state.playing=false;state.search='';$('#global-search').value='';render();window.scrollTo({top:0,behavior:'instant'})}
let toastTimer;function toast(text){$('#toast-root').innerHTML=`<div class="toast" role="status">${escapeHTML(text)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3100)}
function showModal(title,desc,body,buttons=''){ $('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close">${ICON('x')}</button></div>${desc?`<p>${desc}</p>`:''}${body}${buttons}</div></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function createPost(){showModal('✍️ Create a Post','ចែករំលែកអត្ថបទថ្មីទៅកាន់ News Feed ក្នុងគំរូនេះ។','<textarea id="post-body" maxlength="1500" placeholder="តើអ្នកចង់និយាយអ្វីថ្ងៃនេះ? 🇰🇭"></textarea>','<div class="modal-actions"><button class="ghost-btn" data-action="close-modal">Cancel</button><button class="primary" data-action="publish-post">Publish Post</button></div>');$('#post-body').focus()}
function createGroup(){showModal('👥 Create Community','បង្កើតសហគមន៍គំរូនៅក្នុង Browser នេះ។','<input type="text" id="group-name" maxlength="60" placeholder="ឈ្មោះ Community"><textarea style="min-height:85px" id="group-desc" maxlength="180" placeholder="Description / ការពិពណ៌នា"></textarea>','<div class="modal-actions"><button class="ghost-btn" data-action="close-modal">Cancel</button><button class="primary" data-action="publish-group">Create Group</button></div>')}
function uploadModal(){showModal('🎬 Creator Studio — Local Preview','ជ្រើស MP4/WebM ដើម្បីសាកល្បងមើលក្នុង Browser។ វីដេអូមិនត្រូវបាន Upload ទៅ Server ទេ។','<input type="file" accept="video/mp4,video/webm,video/ogg" id="local-video"><div id="local-preview" style="margin-top:12px"></div>','<div class="modal-actions"><button class="ghost-btn" data-action="close-modal">Close</button></div>')}
function roomModal(id){const r=rooms.find(x=>x.id===id);if(!r)return;showModal(r.emoji+' '+r.name,'Voice Room preview — only a visual demonstration. No microphone is activated and no voice connection is established.',`<div style="border:1px solid #374766;border-radius:13px;background:linear-gradient(110deg,#1c3559,#352854);text-align:center;padding:24px 15px"><div style="font-size:42px">${r.people}</div><h3 style="margin:13px 0">${r.name}</h3><span class="pill">${ICON('rooms','small')} Voice connection: OFFLINE DEMO</span></div><div class="guidance" style="margin-bottom:0">${ICON('lock')}<span>Audio, access controls and real-time moderation require server integration.</span></div>`,'<div class="modal-actions"><button class="primary" data-action="close-modal">Leave Preview</button></div>')}
async function shareLink(id){const link=location.href.split('#')[0]+'#post-'+encodeURIComponent(id);try{if(navigator.share){await navigator.share({title:'MEWVIO Social Demo',url:link});return}if(navigator.clipboard){await navigator.clipboard.writeText(link);toast('Link copied! (demo-only local link)');return}}catch{}toast('Sharing is available when hosted online. This is a local demo.')}
function handleAction(a,id){switch(a){case'create-post':return createPost();case'publish-post':{const body=$('#post-body')?.value.trim();if(!body)return toast('សូមបញ្ចូលអត្ថបទមុន Publish');state.posts.unshift({id:'u'+Date.now(),user:'MEWVIO Creator',emoji:'🐱',time:'ឥឡូវនេះ',body,likes:0,comments:0,shares:0,category:'following'});persist();closeModal();go('home');return toast('Post បានបង្កើតក្នុង Demo រួចរាល់ ✅')};case'upload-video':return uploadModal();case'create-group':return createGroup();case'publish-group':{const name=$('#group-name')?.value.trim(),desc=$('#group-desc')?.value.trim();if(!name)return toast('សូមបញ្ចូលឈ្មោះ Group');const g={id:'g'+Date.now(),name,desc:desc||'A new demo community',emoji:'🌟',count:'1',topic:'Creator'};state.groups.unshift(g);state.newGroups.unshift(g);state.joined.add(g.id);persist();closeModal();go('groups');return toast('Community បានបង្កើត ✅')};case'close-modal':return closeModal();case'like':state.liked.has(id)?state.liked.delete(id):state.liked.add(id);break;case'save':state.saved.has(id)?state.saved.delete(id):state.saved.add(id);toast(state.saved.has(id)?'Saved to your demo collection ✅':'Removed from saved items');break;case'follow':state.followed.has(id)?state.followed.delete(id):state.followed.add(id);break;case'join-group':state.joined.has(id)?state.joined.delete(id):state.joined.add(id);toast(state.joined.has(id)?'Joined this community ✅':'Left community');break;case'feed':state.feedTab=id;break;case'room-filter':state.roomFilter=id;break;case'group-filter':state.groupFilter=id;break;case'comments':state.openComments=state.openComments===id?null:id;break;case'send-comment':{const s=$('#comment-input')?.value.trim();if(!s)return toast('សូមបញ្ចូល Comment');(state.comments[id] ||= []).push(s);toast('Comment saved in demo ✅');break};case'share':return shareLink(id);case'join-room':return roomModal(id);case'next-video':state.reel=(state.reel+1)%reels.length;state.playing=false;break;case'select-reel':state.reel=Number(id);state.playing=false;break;case'toggle-video':{const v=$('#reel-video');if(!v)return;if(v.paused){v.play().then(()=>{state.playing=true;$('.play-overlay')?.classList.add('hide')}).catch(()=>toast('Could not play sample video'))}else{v.pause();state.playing=false;$('.play-overlay')?.classList.remove('hide')}return};case'select-chat':state.activeChat=id;break;case'notifications':return showModal('🔔 Notifications','ការជូនដំណឹងគំរូ','<div class="my-post">🎉 Welcome to MEWVIO Social!</div><div class="my-post">🇰🇭 Explore Cambodia Creator Community.</div><div class="my-post">🔐 Privacy & Safety settings will be included in the production app.</div>','<div class="modal-actions"><button class="primary" data-action="close-modal">Close</button></div>');case'story':return toast('Stories គឺជា Preview UI សម្រាប់ដំណាក់កាលបន្ទាប់');case'reel-comments':return toast('Video comments: feature planned for the live backend');case'live-preview':return showModal('🔴 Live Streaming Preview','គំរូប៉ុណ្ណោះ មិនមាន Live ពិតទេ។','<div class="empty-state">Live broadcasting and viewer chat require a real-time media server.</div>','<div class="modal-actions"><button class="primary" data-action="close-modal">Close Preview</button></div>');case'post-more':return showModal('Post Safety & Options','គំរូឧបករណ៍សុវត្ថិភាព','<div class="guidance">You will be able to report, hide or block inappropriate content. These controls require moderation services in production.</div>','<div class="modal-actions"><button class="ghost-btn" data-action="close-modal">Close</button><button class="primary" data-action="report-demo">Report (Demo)</button></div>');case'report-demo':closeModal();return toast('Demo report recorded visually. No report was sent.');case'edit-profile':return showModal('⚙️ Edit Profile','Profile editing requires account authentication.','<div class="my-post">Display name: MEWVIO Creator<br>Username: @mewvio.me<br>Region: Cambodia</div>','<div class="modal-actions"><button class="primary" data-action="close-modal">Close</button></div>');default:return}
 persist();render()}
document.addEventListener('click',e=>{if(e.target.id==='reel-video'){handleAction('toggle-video');return}const page=e.target.closest('[data-page]');if(page){go(page.dataset.page);return}const el=e.target.closest('[data-action]');if(el){handleAction(el.dataset.action,el.dataset.id)}else if(e.target.classList.contains('modal-wrap'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const input=$('#message-input');const s=input?.value.trim();if(!s)return;(state.chat[state.activeChat] ||= []).push({mine:true,text:s,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});persist();render();$('#message-input')?.focus()}});
document.addEventListener('change',e=>{if(e.target.id==='local-video'){const f=e.target.files?.[0],container=$('#local-preview');if(!f||!container)return;if(f.size>100*1024*1024){container.textContent='For this demo, please choose a video under 100 MB.';return}const url=URL.createObjectURL(f);container.innerHTML=`<video controls playsinline style="width:100%;max-height:350px;border-radius:12px;background:#030819"></video><div class="tiny" style="margin-top:9px">${escapeHTML(f.name)} · Browser preview only</div>`;const vid=container.querySelector('video');vid.src=url;vid.addEventListener('ended',()=>{}, {once:true})}});
$('#global-search').addEventListener('input',e=>{state.search=e.target.value;if(state.tab==='home'||state.tab==='groups')$('#view').innerHTML=(state.tab==='home'?renderHome:renderGroups)()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='comment-input'){e.preventDefault();handleAction('send-comment',state.openComments)}});
render();
</script>
</body></html>
